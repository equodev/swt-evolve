<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="swtflutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>swtflutter</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // WebFlutterServer replaces the {{…}} placeholders at serve time (production static path).
    // Under a `flutter run` dev launch (Phase 2 web introspection) they are NOT replaced, so every
    // value is parsed defensively — an unreplaced placeholder degrades to 0 / "" instead of a JS
    // syntax error that would abort this whole block. The real values then arrive via --dart-define
    // (see web_platform.dart). Keep these robust: this file is served verbatim by `flutter run`.
    window.equoCommPort = parseInt("{{EQUO_COMM_PORT}}", 10) || 0;
    window.equoCommUrl = "{{EQUO_COMM_URL}}".indexOf("{{") === 0 ? "" : "{{EQUO_COMM_URL}}";
    window.evolve = {};
    window.evolve.widgetId = parseInt("{{EQUO_WIDGETID}}", 10) || 0;
    window.evolve.widgetName = "{{EQUO_WIDGETNAME}}".indexOf("{{") === 0 ? "" : "{{EQUO_WIDGETNAME}}";
    window.evolve.browserProxy = "{{EQUO_BROWSER_PROXY}}" === "true";
    window.evolve.enableTestSemantics = "{{EQUO_ENABLE_TEST_SEMANTICS}}" === "true";
  </script>
  <script>
    // Chromium reports navigator.language from the host's locale, so a glibc locale carrying a
    // modifier (ca_ES@valencia, sr_RS@latin, en_US@posix) arrives verbatim as "ca-ES@valencia" --
    // not a valid BCP-47 tag. The engine hands that to `new Intl.Locale(...)` while it boots, which
    // throws RangeError and leaves the app dead before its first frame: a blank page, no Flutter
    // view, nothing in the console but that error. Drop the part Intl cannot parse before the
    // engine starts. A tag that already parses is left exactly as the browser reported it.
    (function () {
      function parses(tag) {
        try { new Intl.Locale(tag); return true; } catch (e) { return false; }
      }
      function repair(tag) {
        if (typeof tag !== 'string' || tag === '') return null;
        if (parses(tag)) return tag;
        var base = tag.split('@')[0];
        return parses(base) ? base : null;
      }
      try {
        var reported = navigator.languages || [];
        var repaired = [];
        for (var i = 0; i < reported.length; i++) {
          var tag = repair(reported[i]);
          if (tag !== null && repaired.indexOf(tag) < 0) repaired.push(tag);
        }
        var primary = repair(navigator.language) || repaired[0] || 'en-US';
        if (repaired.length === 0) repaired.push(primary);
        if (primary !== navigator.language) {
          Object.defineProperty(navigator, 'language', { value: primary, configurable: true });
        }
        if (repaired.join(',') !== Array.prototype.join.call(reported, ',')) {
          Object.defineProperty(navigator, 'languages', { value: repaired, configurable: true });
        }
      } catch (e) {
        // A browser that refuses the redefinition is no worse off than without this block.
      }
    })();
  </script>
  <script>
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, true);
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
