<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="swtflutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>swtflutter</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // WebFlutterServer replaces the {{…}} placeholders at serve time (production static path).
    // Under a `flutter run` dev launch (Phase 2 web introspection) they are NOT replaced, so every
    // value is parsed defensively — an unreplaced placeholder degrades to 0 / "" instead of a JS
    // syntax error that would abort this whole block. The real values then arrive via --dart-define
    // (see web_platform.dart). Keep these robust: this file is served verbatim by `flutter run`.
    window.equoCommPort = parseInt("{{EQUO_COMM_PORT}}", 10) || 0;
    window.equoCommUrl = "{{EQUO_COMM_URL}}".indexOf("{{") === 0 ? "" : "{{EQUO_COMM_URL}}";
    window.evolve = {};
    window.evolve.widgetId = parseInt("{{EQUO_WIDGETID}}", 10) || 0;
    window.evolve.widgetName = "{{EQUO_WIDGETNAME}}".indexOf("{{") === 0 ? "" : "{{EQUO_WIDGETNAME}}";
    window.evolve.instance = "{{EQUO_INSTANCE}}".indexOf("{{") === 0 ? "" : "{{EQUO_INSTANCE}}";
    window.evolve.browserProxy = "{{EQUO_BROWSER_PROXY}}" === "true";
    window.evolve.enableTestSemantics = "{{EQUO_ENABLE_TEST_SEMANTICS}}" === "true";
    // Names the widget's own passes for the browser's profiler (User Timing), so a release build
    // can be profiled by someone who did not compile it. Off unless asked for.
    window.evolve.perf = "{{EQUO_PERF}}" === "true";
    // The per-build and per-state-change marks, separately: they fire thousands of times a second
    // and were measured costing 12.5% of busy CPU, which a profile must not pay by default.
    window.evolve.perfDetail = "{{EQUO_PERF_DETAIL}}" === "true";
    // Served before the Display's comm was listening: the port is asked for at once, and the app is
    // only run once it has it (flutter_bootstrap.js), so the page loads while the Display is created.
    if ("{{EQUO_COMM_PORT_PENDING}}" === "true") {
      window.evolve.commPortReady = fetch("equo-comm-port", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .catch(function () { return ""; })
        .then(function (port) {
          window.equoCommPort = parseInt(port, 10) || 0;
          if (!window.equoCommPort) console.error("Evolve: the server gave no comm port; the app cannot connect");
        });
    }
  </script>
  <script>
    // Counts the frames the engine has put on screen: it hands each rasterised frame to its display
    // canvases through transferFromImageBitmap, all of one frame's in one task. On the wasm renderer
    // a pixel read-back shares the surface frames are rasterised on, so ImageUtils.toBytes starts
    // one only once every frame already rendered has been shown (see frame_presentation.dart).
    (function () {
      var proto = window.ImageBitmapRenderingContext && ImageBitmapRenderingContext.prototype;
      if (!proto || !proto.transferFromImageBitmap) return;
      var transfer = proto.transferFromImageBitmap;
      var pending = false;
      var waiters = [];
      window.evolve.presentedFrames = 0;
      window.evolve.nextPresentedFrame = function () {
        return new Promise(function (resolve) { waiters.push(resolve); });
      };
      proto.transferFromImageBitmap = function (bitmap) {
        var result = transfer.call(this, bitmap);
        // Only a frame reaching a display canvas; the engine also encodes images on offscreen ones.
        if (bitmap && !pending && this.canvas instanceof HTMLCanvasElement) {
          pending = true;
          queueMicrotask(function () {
            pending = false;
            window.evolve.presentedFrames++;
            var woken = waiters;
            waiters = [];
            for (var i = 0; i < woken.length; i++) woken[i]();
          });
        }
        return result;
      };
    })();
  </script>
  <script>
    // Chromium reports navigator.language from the host's locale, so a glibc locale carrying a
    // modifier (ca_ES@valencia, sr_RS@latin, en_US@posix) arrives verbatim as "ca-ES@valencia" --
    // not a valid BCP-47 tag. The engine hands that to `new Intl.Locale(...)` while it boots, which
    // throws RangeError and leaves the app dead before its first frame: a blank page, no Flutter
    // view, nothing in the console but that error. Drop the part Intl cannot parse before the
    // engine starts. A tag that already parses is left exactly as the browser reported it.
    (function () {
      function parses(tag) {
        try { new Intl.Locale(tag); return true; } catch (e) { return false; }
      }
      function repair(tag) {
        if (typeof tag !== 'string' || tag === '') return null;
        if (parses(tag)) return tag;
        var base = tag.split('@')[0];
        return parses(base) ? base : null;
      }
      try {
        var reported = navigator.languages || [];
        var repaired = [];
        for (var i = 0; i < reported.length; i++) {
          var tag = repair(reported[i]);
          if (tag !== null && repaired.indexOf(tag) < 0) repaired.push(tag);
        }
        var primary = repair(navigator.language) || repaired[0] || 'en-US';
        if (repaired.length === 0) repaired.push(primary);
        if (primary !== navigator.language) {
          Object.defineProperty(navigator, 'language', { value: primary, configurable: true });
        }
        if (repaired.join(',') !== Array.prototype.join.call(reported, ',')) {
          Object.defineProperty(navigator, 'languages', { value: repaired, configurable: true });
        }
      } catch (e) {
        // A browser that refuses the redefinition is no worse off than without this block.
      }
    })();
  </script>
  <script>
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, true);
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
